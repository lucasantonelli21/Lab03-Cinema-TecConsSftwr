    <div class="container">
      <div class="card">
        <div class="card-header text-center">
          <h1 class="mt-5">Cadastro de Sessão</h1>
        </div>

        <form id="SalasForm" class="mt-4">

          <div class="card-body">

            <div class="mb-3">
              <label for="filme" class="form-label">Filme</label>
              <select name="filme" id="filme" class="form-control">
                <option value="">Selecione o Filme</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="sala" class="form-label">Sala</label>
              <select name="sala" id="sala" class="form-control">
                <option value="">Selecione a Sala</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="horario" class="form-label">Data e Hora</label>
              <input
                type="datetime-local"
                class="form-control"
                id="horario"
                name="horario"
                required
              />
            </div>

            <div class="mb-3">
              <label for="idioma" class="form-label">Idioma</label>
              <select name="idioma" id="idioma" class="form-control">
                <option value="">Selecione o Idioma</option>
                <option value="dublado">Dublado</option>
                <option value="legendado">Legendado</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="preco" class="form-label">Preço</label>
              <input
                type="text"
                class="form-control"
                id="preco"
                name="preco"
                placeholder="R$ 0,00"
                required
              />
            </div>

            <div class="mb-3">
              <label for="formato" class="form-label">Formato</label>
              <select name="formato" id="formato" class="form-control">
                <option value="">Selecione o Formato</option>
                <option value="2D">2D</option>
                <option value="3D">3D</option>
                <option value="IMAX">IMAX</option>
              </select>

            </div>

          </div>

          <div class="card-footer text-end">
            <button type="submit" class="btn btn-success">Cadastrar Sessão</button>
          </div>

        </form>
      </div>
      
    </div>
  </body>
