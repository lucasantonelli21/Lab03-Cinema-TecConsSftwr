      <div class="card">

        </div>

        <form id="filmeForm" class="mt-4">

          <div class="card-body">

            <div class="mb-3">
              <label for="titulo" class="form-label">Título</label>
              <input type="text" class="form-control" id="titulo" required />
            </div>

            <div class="mb-3">
              <label for="sinopse" class="form-label">Sinopse</label>
              <textarea class="form-control" id="sinopse" rows="3" required></textarea>
            </div>

            <div class="mb-3">
              <label for="genero" class="form-label">Gênero</label>
              <select name="gender" class="form-control" id="genero">
                <option value="acao">Ação</option>
                <option value="comedia">Comédia</option>
                <option value="drama">Drama</option>
                <option value="terror">Terror</option>
                <option value="romance">Romance</option>
                <option value="aventura">Aventura</option>
                <option value="suspense">Suspense</option>
                <option value="ficcao">Ficção Científica</option>
                <option value="fantasia">Fantasia</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="classificacao" class="form-label">Classificação Indicativa</label>
              <select name="classificacao" class="form-control" id="classificacao">
                <option value="livre">Livre</option>
                <option value="10">10 anos</option>
                <option value="12">12 anos</option>
                <option value="14">14 anos</option>
                <option value="16">16 anos</option>
                <option value="18">18 anos</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="duracao" class="form-label">Duração (minutos)</label>
              <input type="number" class="form-control" id="duracao" required />
            </div>            

            <div class="mb-3">
              <label for="sinopse" class="form-label">Data de Estreia</label>
              <input type="date" class="form-control" id="estreia" required />
            </div>

            <div class="mb-3">
              <label for="imagem" class="form-label">URL da Imagem do Filme</label>
              <input type="url" class="form-control" id="imagem" placeholder="https://exemplo.com/imagem.jpg" />
              <small class="form-text text-muted">Cole o URL de uma imagem online do filme</small>
              
              <!-- Preview da imagem -->
              <div class="mt-2">
                <img id="imagemPreview" src="/assets/filme.jpg" alt="Preview" class="img-thumbnail" style="max-height: 200px;">
              </div>
            </div>

          </div>

          <div class="card-footer text-end">
            <button type="submit" class="btn btn-success">Cadastrar Filme</button>
          </div>

        </form>
      </div>
