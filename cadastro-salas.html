    <div class="container">
      <div class="card">
        <div class="card-header text-center">
          <h1 class="mt-5">Cadastro de Salas</h1>
        </div>

        <form id="SalasForm" class="mt-4">

          <div class="card-body">

            <div class="mb-3">
              <label for="numero" class="form-label">Número da Sala</label>
              <input type="number" class="form-control" id="numero" required />
            </div>

            <div class="mb-3">
              <label for="capacidade" class="form-label">Capacidade da Sala</label>
              <input type="number" class="form-control" id="capacidade" required />
            </div>

            <div class="mb-3">
              <label for="tipo" class="form-label">Tipo de Sala</label>
              <select name="tipo" class="form-control" id="tipo">
                <option value="normal">2D</option>
                <option value="3d">3D</option>
                <option value="imax">IMAX</option>
              </select>
            </div>

          </div>

          <div class="card-footer text-end">
            <button type="submit" class="btn btn-success">Cadastrar Sala</button>
          </div>

        </form>
      </div>
      
    </div>
